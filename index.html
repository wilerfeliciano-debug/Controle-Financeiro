<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Financeiro by Wiler Felipe</title>
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#121212">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<style>
body{
  font-family: Arial;
  background: #121212;
  color: white;
  text-align: center;
}

input, select, button {
  padding: 6px;
  margin: 5px;
}

table {
  margin: auto;
  border-collapse: collapse;
  width: 90%;
  margin-top: 20px;
}

td, th {
  border: 1px solid #444;
  padding: 8px;
}

th {
  background: #333;
}

canvas {
  max-width: 90%;
  margin-top: 20px;
}

#graficoComparativo {
  max-width: 70%;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginArea">
  <h3>Login</h3>
  <input id="email" placeholder="Email"><br>
  <input id="senha" type="password" placeholder="Senha"><br>
  <button onclick="login()">Entrar</button>
  <button onclick="cadastrar()">Cadastrar</button>
</div>

<h2>Controle Financeiro by Wiler Felipe</h2>

<select id="mes" onchange="carregar()">
  <option value="2026-01">Janeiro</option>
  <option value="2026-02">Fevereiro</option>
  <option value="2026-03">Março</option>
  <option value="2026-04">Abril</option>
  <option value="2026-05">Maio</option>
  <option value="2026-06">Junho</option>
  <option value="2026-07">Julho</option>
  <option value="2026-08">Agosto</option>
  <option value="2026-09">Setembro</option>
  <option value="2026-10">Outubro</option>
  <option value="2026-11">Novembro</option>
  <option value="2026-12">Dezembro</option>
</select>

<br>
<button onclick="exportar()">Exportar</button>
<input type="file" id="fileImport" onchange="importar()">
<br>

Salário <input id="salario" type="number" onchange="salvarSalario()"><br>
Descrição <input id="desc">
Valor <input id="valor" type="number">
<select id="categoria">
  <option>Fixos</option>
  <option>Necessário</option>
  <option>Desnecessário</option>
  <option>Mercado</option>
  <option>Combustivel</option>
  <option>Cartão Crédito</option>
  <option>Investimento</option>
  <option>Cursos e Treinamentos</option>
  <option>Manutenção</option>
</select>
<button onclick="adicionar()">Adicionar</button>

<table>
<tr>
<th>Descrição</th>
<th>Categoria</th>
<th>Valor</th>
<th>X</th>
</tr>
<tbody id="lista"></tbody>
</table>

<h3>Total: R$ <span id="total">0</span></h3>
<h3>Saldo: R$ <span id="saldo">0</span></h3>

<canvas id="grafico"></canvas>
<canvas id="graficoComparativo"></canvas>

<script>
// 🔥 FIREBASE CONFIGURAÇÃO
const firebaseConfig = {
  apiKey: "AIzaSyCZDhLOMCBgJsDh-qAqOYaOIpWzjejkiEA",
  authDomain: "controle-financeiro-master--v2.firebaseapp.com",
  projectId: "controle-financeiro-master--v2",
  storageBucket: "controle-financeiro-master--v2.firebasestorage.app",
  messagingSenderId: "1041110530420",
  appId: "1:1041110530420:web:15f9fe96151f729aaf5421",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// 🔐 LOGIN / CADASTRO
function cadastrar(){
  let email = document.getElementById("email").value;
  let senha = document.getElementById("senha").value;
  auth.createUserWithEmailAndPassword(email, senha)
    .then(()=>alert("Conta criada!"))
    .catch(e=>alert(e.message));
}

function login(){
  let email = document.getElementById("email").value;
  let senha = document.getElementById("senha").value;
  auth.signInWithEmailAndPassword(email, senha)
    .then(()=>alert("Logado com sucesso!"))
    .catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginArea").style.display="none";
    carregar();
  }
});

let gastos = [];
let salario = 0;
let grafico;
let grafico2;

// 📅 MÊS
function mesAtual(){ return document.getElementById("mes").value; }

// 📤 EXPORTAR
async function exportar(){
  let snapshot = await db.collection("meses").get();
  let dados = {};
  snapshot.forEach(doc=> dados[doc.id] = doc.data());
  let blob = new Blob([JSON.stringify(dados)], {type:"application/json"});
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "backup.json";
  link.click();
}

// 📥 IMPORTAR
function importar(){
  let file = document.getElementById("fileImport").files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = async function(e){
    let dados = JSON.parse(e.target.result);
    let snap = await db.collection("meses").get();
    for(const d of snap.docs){ await db.collection("meses").doc(d.id).delete(); }
    for(let m in dados){ await db.collection("meses").doc(m).set(dados[m]); }
    carregar();
  };
  reader.readAsText(file);
}

// 💾 SALVAR (CORRIGIDO)
async function salvarSalario(){
  salario = Number(document.getElementById("salario").value);
  await db.collection("meses").doc(mesAtual()).set(
    { salario, gastos },
    { merge: true }
  );
  carregar();
}

// ➕ ADD (CORRIGIDO)
async function adicionar(){
  let desc = document.getElementById("desc").value;
  let valor = Number(document.getElementById("valor").value);
  let cat = document.getElementById("categoria").value;
  if(!desc || !valor) return;

  gastos.push({desc,valor,cat});

  await db.collection("meses").doc(mesAtual()).set(
    { salario, gastos },
    { merge: true }
  );

  document.getElementById("desc").value = "";
  document.getElementById("valor").value = "";
  carregar();
}

// ❌ DELETE (CORRIGIDO)
async function excluir(i){
  gastos.splice(i,1);

  await db.collection("meses").doc(mesAtual()).set(
    { salario, gastos },
    { merge: true }
  );

  carregar();
}

// 📥 LOAD
async function carregar(){
  let doc = await db.collection("meses").doc(mesAtual()).get();
  if(doc.exists){
    let data = doc.data();
    gastos = data.gastos || [];
    salario = data.salario || 0;
  } else {
    gastos = [];
    salario = 0;
  }
  document.getElementById("salario").value = salario;
  atualizar();
}

// 🧠 NOVO CÁLCULO DE SALDO (CORRETO)
async function calcularSaldoAteMes(mesAtualSelecionado){
  let snapshot = await db.collection("meses")
    .orderBy(firebase.firestore.FieldPath.documentId())
    .get();

  let saldo = 0;

  snapshot.forEach(doc=>{
    if(doc.id <= mesAtualSelecionado){
      let data = doc.data();
      let total = (data.gastos || []).reduce((s,g)=>s+g.valor,0);
      saldo += (data.salario || 0) - total;
    }
  });

  return saldo;
}

// 🔄 UPDATE (CORRIGIDO)
async function atualizar(){
  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  let total=0;
  let categorias={};

  gastos.forEach((g,i)=>{
    total += g.valor;
    categorias[g.cat] = (categorias[g.cat]||0)+g.valor;

    lista.innerHTML += `
      <tr>
        <td>${g.desc}</td>
        <td>${g.cat}</td>
        <td>${g.valor}</td>
        <td><button onclick="excluir(${i})">X</button></td>
      </tr>`;
  });

  let saldoFinal = await calcularSaldoAteMes(mesAtual());

  document.getElementById("total").innerText = total.toFixed(2);
  document.getElementById("saldo").innerText = saldoFinal.toFixed(2);

  desenharPizza(categorias);
  desenharComparativo();
}

// 📊 GRÁFICOS
function desenharPizza(cat){
  let ctx = document.getElementById("grafico");
  if(grafico) grafico.destroy();
  grafico = new Chart(ctx,{
    type:"pie",
    data:{labels:Object.keys(cat),datasets:[{data:Object.values(cat)}]}
  });
}

// 📊 COMPARATIVO (CORRIGIDO)
async function desenharComparativo(){
  let snapshot = await db.collection("meses")
    .orderBy(firebase.firestore.FieldPath.documentId())
    .get();

  let meses=[];
  let categorias={};

  snapshot.forEach(doc=>{
    meses.push(doc.id);
    let data=doc.data();
    (data.gastos||[]).forEach(g=>{
      if(!categorias[g.cat]) categorias[g.cat]=[];
    });
  });

  meses.sort();

  for(let cat in categorias){
    categorias[cat] = meses.map(()=>0);
  }

  snapshot.forEach(doc=>{
    let i=meses.indexOf(doc.id);
    let data=doc.data();
    (data.gastos||[]).forEach(g=>{
      categorias[g.cat][i]+=g.valor;
    });
  });

  let datasets = Object.keys(categorias).map(cat=>({
    label:cat,
    data:categorias[cat]
  }));

  let ctx = document.getElementById("graficoComparativo");
  if(grafico2) grafico2.destroy();

  grafico2 = new Chart(ctx,{
    type:"line",
    data:{labels:meses,datasets:datasets}
  });
}

// INIT
window.addEventListener('load', ()=>carregar());
</script>
</body>
</html>
